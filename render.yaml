# Render Blueprint — một web service phục vụ cả API (/api) lẫn giao diện React (client/dist).
# Dữ liệu nằm trên Supabase (PostgreSQL), tệp tải lên nằm trên Cloudflare R2,
# nên service không cần ổ đĩa và có thể chạy gói Free (gói Free sẽ "ngủ" khi không có truy cập).
# Hướng dẫn chi tiết: README.md → "Deploy to Render".
services:
  - type: web
    name: nep-hoc-lms-backend
    runtime: node
    plan: free
    region: singapore
    # NODE_ENV=development chỉ cho bước cài đặt để có devDependencies (vite, typescript) khi build.
    buildCommand: >-
      npm install -g corepack@latest &&
      corepack enable &&
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm --filter client build
    startCommand: pnpm --filter server start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: 10000
      # Supabase → Connect → "Session pooler" (IPv4). Bảng được tạo tự động khi khởi động (migration).
      - key: DATABASE_URL
        sync: false
      # Lần khởi động đầu tiên (DB chưa có tài khoản) chỉ tạo 1 quản trị viên — không có dữ liệu mẫu.
      - key: SEED_ADMIN_EMAIL
        sync: false
      # Mật khẩu ban đầu của quản trị viên đầu tiên (≥ 8 ký tự)
      - key: SEED_DEFAULT_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: Quản trị viên
      # Chỉ cần khi frontend chạy ở domain khác (VD: Vercel). Phân tách nhiều origin bằng dấu phẩy.
      - key: CORS_ORIGIN
        sync: false
      # KHÔNG đặt ENABLE_DEMO_LOGIN ở production.
      # Cloudflare R2 — nơi lưu tệp tải lên. Không đặt -> tệp lưu tạm trên máy chủ và MẤT khi Render khởi động lại.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
