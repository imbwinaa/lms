openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: |
    Learning management system API.

    Every endpoint except `GET /healthz`, `GET /auth/config`, `POST /auth/login` and
    `POST /auth/demo-login` requires `Authorization: Bearer <token>`.
    The acting user is always taken from the token, never from the request body.
    Errors always use the `ErrorResponse` shape.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Sessions and identity
  - name: lms
    description: LMS dashboard, learning, and automation
  - name: content
    description: Course materials, assignments and submissions
  - name: upload
    description: File upload and media presets
  - name: studio
    description: Course sections, lessons, quizzes and learner progress
  - name: schedule
    description: Live class sessions (Teams / Google Meet / Zoom) of a course
  - name: enrollment
    description: Joining courses, approval requests and invite links
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      security: []
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  # ---------------------------------------------------------------- AUTH
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      security: []
      summary: Public auth configuration (e.g. whether demo login is enabled)
      responses:
        "200":
          description: Auth configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Account is locked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/demo-login:
    post:
      operationId: demoLogin
      tags: [auth]
      security: []
      summary: Sign in as a seeded demo account (only when ENABLE_DEMO_LOGIN=true)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoLoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "403":
          description: Account is locked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }

  # ---------------------------------------------------------------- DASHBOARD
  /lms/dashboard:
    get:
      operationId: getLmsDashboard
      tags: [lms]
      summary: Get dashboard overview
      responses:
        "200":
          description: LMS overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  # ---------------------------------------------------------------- COURSES
  /lms/courses:
    get:
      operationId: listLmsCourses
      tags: [lms]
      summary: List courses visible to the current user
      description: Students see active courses and courses they are enrolled in; lecturers and admins see all.
      responses:
        "200":
          description: Course catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Course" }
    post:
      operationId: createLmsCourse
      tags: [lms]
      summary: Create a course (lecturer or admin)
      description: A lecturer becomes the instructor. An admin may set `instructorId`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseInput" }
      responses:
        "201":
          description: Created course
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /lms/courses/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getLmsCourse
      tags: [lms]
      summary: Get one course
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateLmsCourse
      tags: [lms]
      summary: Update a course (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseUpdate" }
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteLmsCourse
      tags: [lms]
      summary: Delete a course and its content (instructor or admin)
      responses:
        "200":
          description: Course deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- ENROLLMENT (join, approval, invites)
  /lms/courses/{id}/join:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: joinCourse
      tags: [enrollment]
      summary: Join a public course (free to join) or ask to join (approval required)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinCourseInput" }
      responses:
        "200":
          description: Enrollment state after the request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinCourseResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: cancelJoinRequest
      tags: [enrollment]
      summary: Withdraw the current student's pending join request
      responses:
        "200":
          description: Request withdrawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinCourseResult" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/courses/{id}/enrollment-requests:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: listEnrollmentRequests
      tags: [enrollment]
      summary: Pending join requests of a course (instructor or admin)
      responses:
        "200":
          description: Pending requests, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EnrollmentRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /lms/enrollment-requests/{id}/decision:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: decideEnrollmentRequest
      tags: [enrollment]
      summary: Approve (enroll) or reject a join request (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentDecisionInput" }
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /lms/courses/{id}/invites:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: listCourseInvites
      tags: [enrollment]
      summary: Invite links of a course (instructor or admin)
      responses:
        "200":
          description: Invite links, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CourseInvite" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createCourseInvite
      tags: [enrollment]
      summary: Create an invite link with optional expiry and maximum uses (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseInviteInput" }
      responses:
        "201":
          description: Created invite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /lms/invites/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      operationId: revokeCourseInvite
      tags: [enrollment]
      summary: Revoke an invite link (instructor or admin)
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/invite-links/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, minLength: 16, maxLength: 64 }
    get:
      operationId: getInviteLink
      tags: [enrollment]
      summary: Preview an invite link (signed-in user)
      responses:
        "200":
          description: Invite preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: acceptInviteLink
      tags: [enrollment]
      summary: Join the course of an invite link (students)
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinCourseResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/BadRequest" }

  /lms/courses/{id}/learners:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: listCourseLearners
      tags: [lms]
      summary: Students enrolled in a course (instructor or admin)
      responses:
        "200":
          description: Enrolled students
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Learner" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- ACCOUNTS
  /lms/accounts:
    get:
      operationId: listLmsAccounts
      tags: [lms]
      summary: List accounts (admin sees everyone, lecturer sees students)
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Learner" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createLmsAccount
      tags: [lms]
      summary: Create an account with a role and initial password (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /lms/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updateLmsAccount
      tags: [lms]
      summary: Update an account's name, email or team (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteLmsAccount
      tags: [lms]
      summary: Permanently delete an account and its enrollments, submissions and sessions (admin)
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/accounts/{id}/role:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updateLmsAccountRole
      tags: [lms]
      summary: Change an account's role (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountRoleUpdate" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/accounts/{id}/status:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updateLmsAccountStatus
      tags: [lms]
      summary: Lock or unlock an account; locking signs the user out everywhere (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountStatusUpdate" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/accounts/{id}/password:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      operationId: resetLmsAccountPassword
      tags: [lms]
      summary: Set a new password for an account and sign it out everywhere (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountPasswordReset" }
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- CATALOG / GAMIFICATION
  /lms/learning-paths:
    get:
      operationId: listLmsLearningPaths
      tags: [lms]
      summary: List learning paths
      responses:
        "200":
          description: Learning paths
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LearningPath" }
  /lms/enrollments/auto-enroll:
    post:
      operationId: autoEnrollLearners
      tags: [lms]
      summary: Enroll learners into a course (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentInput" }
      responses:
        "201":
          description: Enrollment result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/certificates:
    get:
      operationId: listLmsCertificates
      tags: [lms]
      summary: List certificates
      responses:
        "200":
          description: Certificates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Certificate" }
  /lms/leaderboard:
    get:
      operationId: getLmsLeaderboard
      tags: [lms]
      summary: Get leaderboard
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeaderboardEntry" }
  /lms/badges:
    get:
      operationId: listLmsBadges
      tags: [lms]
      summary: List awarded badges
      responses:
        "200":
          description: Badges
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LearnerBadge" }
  /lms/plugins:
    get:
      operationId: listLmsPlugins
      tags: [lms]
      summary: List learning standard plugins
      responses:
        "200":
          description: Plugins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LearningPlugin" }
  # ---------------------------------------------------------------- COURSE CONTENT (sections, lessons, quizzes)
  /lms/courses/{id}/outline:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getCourseOutline
      tags: [studio]
      summary: Sections and lessons of a course, with the current user's progress
      description: The instructor and admins see unpublished lessons; everyone else sees published lessons only.
      responses:
        "200":
          description: Course outline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseOutline" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/courses/{id}/outline/order:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      operationId: reorderCourseOutline
      tags: [studio]
      summary: Reorder sections and lessons (instructor or admin)
      description: Send every section of the course in the new order, each with the ids of its lessons in order. Lessons may move between sections.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutlineOrderInput" }
      responses:
        "200":
          description: Updated outline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseOutline" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/courses/{id}/sections:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: createCourseSection
      tags: [studio]
      summary: Add a section at the end of the course (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionInput" }
      responses:
        "201":
          description: Created section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseSection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/sections/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updateCourseSection
      tags: [studio]
      summary: Rename a section (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionInput" }
      responses:
        "200":
          description: Updated section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseSection" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteCourseSection
      tags: [studio]
      summary: Delete a section and all its lessons (instructor or admin)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/courses/{id}/lessons:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: createCourseLesson
      tags: [studio]
      summary: Add an unpublished lesson at the end of a section (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonInput" }
      responses:
        "201":
          description: Created lesson
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/lessons/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getLesson
      tags: [studio]
      summary: Full lesson content. Quiz answers are only included for the instructor and admins.
      responses:
        "200":
          description: Lesson
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateLesson
      tags: [studio]
      summary: Edit a lesson (instructor or admin). HTML content is sanitized on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonUpdate" }
      responses:
        "200":
          description: Updated lesson
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteLesson
      tags: [studio]
      summary: Delete a lesson (instructor or admin)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/lessons/{id}/questions:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      operationId: replaceQuizQuestions
      tags: [studio]
      summary: Replace all questions of a quiz lesson (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizQuestionsInput" }
      responses:
        "200":
          description: Updated lesson
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/lessons/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: completeLesson
      tags: [studio]
      summary: Mark a video, text or document lesson complete for the current student
      description: Quiz lessons are completed by passing a quiz attempt instead.
      responses:
        "200":
          description: Completion result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonCompletionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/lessons/{id}/quiz-attempts:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: submitQuizAttempt
      tags: [studio]
      summary: Submit answers to a quiz lesson. Scored on the server; passing completes the lesson.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizAttemptInput" }
      responses:
        "201":
          description: Scored attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizAttemptResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/xapi/events:
    post:
      operationId: recordXapiEvent
      tags: [lms]
      summary: Record an xAPI event for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/XapiEventInput" }
      responses:
        "201":
          description: Recorded xAPI event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XapiEvent" }

  # ---------------------------------------------------------------- SCHEDULE (live class sessions)
  /lms/courses/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: listCourseSessions
      tags: [schedule]
      summary: Live sessions of a course, ordered by start time
      description: |
        meetingUrl is only returned to enrolled students, the course instructor and admins;
        other viewers of an open course get null.
      parameters:
        - name: from
          in: query
          required: false
          description: Only sessions ending at or after this time (ISO 8601)
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Only sessions starting before this time (ISO 8601)
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassSession" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createCourseSessions
      tags: [schedule]
      summary: Schedule a session, or a weekly series of sessions (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassSessionInput" }
      responses:
        "201":
          description: Created sessions (one per week when repeating)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/sessions/upcoming:
    get:
      operationId: listUpcomingSessions
      tags: [schedule]
      summary: Next sessions across the current user's courses (for dashboards)
      description: Students see their enrolled courses, lecturers the courses they teach, admins all courses.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 5 }
      responses:
        "200":
          description: Upcoming and ongoing sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassSession" }
  /lms/sessions/calendar:
    get:
      operationId: listCalendarSessions
      tags: [schedule]
      summary: Sessions across the current user's courses that overlap a time range (dashboard calendar)
      description: Same course scope as /lms/sessions/upcoming. The range may span at most 190 days.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Sessions ordered by start time
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /lms/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updateCourseSession
      tags: [schedule]
      summary: Edit one session (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassSessionUpdate" }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteCourseSession
      tags: [schedule]
      summary: Cancel a session, or it and every later session of its weekly series (instructor or admin)
      parameters:
        - name: scope
          in: query
          required: false
          schema: { $ref: "#/components/schemas/SessionDeleteScope" }
      responses:
        "200":
          description: Number of cancelled sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDeleteResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- MATERIALS
  /lms/courses/{id}/materials:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: listCourseMaterials
      tags: [content]
      summary: List materials of a course (enrolled, instructor or admin)
      responses:
        "200":
          description: Materials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Material" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createCourseMaterial
      tags: [content]
      summary: Add a material to a course (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaterialInput" }
      responses:
        "201":
          description: Created material
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/materials/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      operationId: deleteMaterial
      tags: [content]
      summary: Delete a material (instructor or admin)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/materials/{id}/download:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: recordMaterialDownload
      tags: [content]
      summary: Count a material download
      responses:
        "200":
          description: New download count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- ASSIGNMENTS
  /lms/assignments:
    get:
      operationId: listMyAssignments
      tags: [content]
      summary: Assignments across all courses visible to the current user
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Assignment" }
  /lms/courses/{id}/assignments:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: listCourseAssignments
      tags: [content]
      summary: List assignments of a course (enrolled, instructor or admin)
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Assignment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createCourseAssignment
      tags: [content]
      summary: Create an assignment (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentInput" }
      responses:
        "201":
          description: Created assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/assignments/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      operationId: deleteAssignment
      tags: [content]
      summary: Delete an assignment and its submissions (instructor or admin)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- SUBMISSIONS
  /lms/submissions:
    get:
      operationId: listMySubmissions
      tags: [content]
      summary: Submissions visible to the current user (own for students, own courses for lecturers)
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/SubmissionStatus" }
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Submission" }
  /lms/assignments/{id}/submissions:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: listAssignmentSubmissions
      tags: [content]
      summary: Submissions of an assignment (students only see their own)
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Submission" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: submitAssignment
      tags: [content]
      summary: Submit or resubmit the current student's work
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionInput" }
      responses:
        "201":
          description: Saved submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/submissions/{id}/grade:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: gradeSubmission
      tags: [content]
      summary: Grade a submission (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GradeInput" }
      responses:
        "200":
          description: Graded submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- UPLOAD
  /upload:
    post:
      operationId: uploadFile
      tags: [upload]
      summary: Upload a base64 file or link a preset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "201":
          description: Stored file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/BadRequest" }
  /upload/presets:
    get:
      operationId: listMediaPresets
      tags: [upload]
      summary: Built-in sample media library
      responses:
        "200":
          description: Presets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MediaPreset" }
  /upload/recent:
    get:
      operationId: listRecentUploads
      tags: [upload]
      summary: Files stored on the local disk (admin)
      responses:
        "200":
          description: Files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UploadedFile" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Sign-in required or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Not allowed for this user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    # ------------------------------------------------ common
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    UserRole:
      type: string
      enum: [student, lecturer, admin]

    # ------------------------------------------------ auth
    AuthConfig:
      type: object
      required: [demoLoginEnabled]
      properties:
        demoLoginEnabled: { type: boolean }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    DemoLoginInput:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/UserRole" }
    AuthUser:
      type: object
      required: [id, name, email, role, team, avatar, title, points, streak, progress, activeCourse]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        team: { type: string }
        avatar: { type: string }
        title: { type: string }
        points: { type: integer }
        streak: { type: integer }
        progress: { type: number }
        activeCourse: { type: string }
    AuthSession:
      type: object
      required: [token, user, message]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/AuthUser" }
        message: { type: string }

    # ------------------------------------------------ dashboard
    ActivityItem:
      type: object
      required: [id, title, detail, time, kind]
      properties:
        id: { type: integer }
        title: { type: string }
        detail: { type: string }
        time: { type: string }
        kind: { type: string, enum: [enrollment, completion, certificate, quiz] }
    EngagementDay:
      type: object
      required: [day, active, completed]
      properties:
        day: { type: string }
        active: { type: integer }
        completed: { type: integer }
    DashboardSummary:
      type: object
      required: [activeCourses, totalLearners, completionRate, pendingCertificates, weeklyEngagement, recentActivity]
      properties:
        activeCourses: { type: integer }
        totalLearners: { type: integer }
        completionRate: { type: number }
        pendingCertificates: { type: integer }
        weeklyEngagement:
          type: array
          items: { $ref: "#/components/schemas/EngagementDay" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }

    # ------------------------------------------------ courses
    CourseLevel:
      type: string
      enum: [Cơ bản, Trung cấp, Nâng cao]
    CourseStatus:
      type: string
      enum: [Đang hoạt động, Bản nháp, Lưu trữ]
    CourseFormat:
      type: string
      enum: [Native, SCORM 1.2, xAPI, H5P]
    MediaType:
      type: string
      enum: [video, audio, document, scorm]
    Course:
      type: object
      required: [id, title, description, category, level, duration, lessons, enrolled, progress, status, format, accent, instructorId, instructorName, mediaUrl, mediaType, coverImageUrl, visibility, enrollmentMethod, myEnrollment]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        level: { $ref: "#/components/schemas/CourseLevel" }
        duration: { type: string }
        lessons: { type: integer, description: "Number of published lessons" }
        enrolled: { type: integer }
        progress: { type: number }
        status: { $ref: "#/components/schemas/CourseStatus" }
        format: { $ref: "#/components/schemas/CourseFormat" }
        accent: { type: string }
        instructorId: { type: [integer, "null"] }
        instructorName: { type: string }
        mediaUrl: { type: [string, "null"] }
        mediaType: { type: [string, "null"] }
        coverImageUrl: { type: [string, "null"], description: "16:9 cover used on cards and the course header" }
        visibility: { $ref: "#/components/schemas/CourseVisibility" }
        enrollmentMethod: { $ref: "#/components/schemas/EnrollmentMethod" }
        myEnrollment: { $ref: "#/components/schemas/MyEnrollment" }
    CourseInput:
      type: object
      required: [title, description, category, level, duration, format]
      properties:
        title: { type: string, minLength: 2 }
        description: { type: string }
        category: { type: string }
        level: { $ref: "#/components/schemas/CourseLevel" }
        duration: { type: string }
        lessons: { type: integer, description: "Deprecated and ignored: counted from published lessons" }
        format: { $ref: "#/components/schemas/CourseFormat" }
        instructorId: { type: integer, description: "Admin only; ignored for lecturers" }
        mediaUrl: { type: [string, "null"] }
        mediaType: { $ref: "#/components/schemas/MediaType" }
        coverImageUrl: { type: [string, "null"] }
        visibility: { $ref: "#/components/schemas/CourseVisibility" }
        enrollmentMethod: { $ref: "#/components/schemas/EnrollmentMethod" }
    CourseUpdate:
      type: object
      properties:
        title: { type: string, minLength: 2 }
        description: { type: string }
        category: { type: string }
        level: { $ref: "#/components/schemas/CourseLevel" }
        duration: { type: string }
        lessons: { type: integer, description: "Deprecated and ignored: counted from published lessons" }
        status: { $ref: "#/components/schemas/CourseStatus" }
        format: { $ref: "#/components/schemas/CourseFormat" }
        instructorId: { type: integer, description: "Admin only" }
        mediaUrl: { type: [string, "null"] }
        mediaType: { $ref: "#/components/schemas/MediaType" }
        coverImageUrl: { type: [string, "null"] }
        visibility: { $ref: "#/components/schemas/CourseVisibility" }
        enrollmentMethod: { $ref: "#/components/schemas/EnrollmentMethod" }

    # ------------------------------------------------ visibility & enrollment
    CourseVisibility:
      type: string
      enum: [public, private]
      description: "public: listed for every student; private: only enrolled students (invite-only)"
    EnrollmentMethod:
      type: string
      enum: [open, approval]
      description: "How students join a public course: open (instantly) or approval (instructor approves)"
    MyEnrollment:
      type: string
      enum: [enrolled, pending, none]
      description: "The current student's state in this course (staff: none)"
    JoinCourseInput:
      type: object
      properties:
        message: { type: string, maxLength: 500, description: "Optional note to the instructor (approval courses)" }
    JoinCourseResult:
      type: object
      required: [courseId, status, message]
      properties:
        courseId: { type: integer }
        status: { $ref: "#/components/schemas/MyEnrollment" }
        message: { type: string }
    EnrollmentRequestStatus:
      type: string
      enum: [pending, approved, rejected]
    EnrollmentRequest:
      type: object
      required: [id, courseId, learnerId, learnerName, learnerEmail, learnerTeam, message, status, createdAt]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        learnerId: { type: integer }
        learnerName: { type: string }
        learnerEmail: { type: string }
        learnerTeam: { type: string }
        message: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/EnrollmentRequestStatus" }
        createdAt: { type: string, format: date-time }
    EnrollmentDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
    CourseInvite:
      type: object
      required: [id, courseId, token, expiresAt, maxUses, uses, revoked, active, createdAt]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        token: { type: string, description: "Share as <app>/invite/<token>" }
        expiresAt: { type: [string, "null"], format: date-time }
        maxUses: { type: [integer, "null"] }
        uses: { type: integer }
        revoked: { type: boolean }
        active: { type: boolean, description: "Not revoked, not expired and not used up" }
        createdAt: { type: string, format: date-time }
    CourseInviteInput:
      type: object
      properties:
        expiresAt: { type: [string, "null"], format: date-time, description: "Must be in the future; null = never" }
        maxUses: { type: [integer, "null"], minimum: 1, maximum: 1000, description: "null = unlimited" }
    InvitePreview:
      type: object
      required: [courseId, courseTitle, courseDescription, instructorName, valid, reason, alreadyEnrolled]
      properties:
        courseId: { type: integer }
        courseTitle: { type: string }
        courseDescription: { type: string }
        instructorName: { type: string }
        valid: { type: boolean }
        reason: { type: [string, "null"], description: "Why the link can't be used" }
        alreadyEnrolled: { type: boolean }

    # ------------------------------------------------ accounts
    AccountStatus:
      type: string
      enum: [active, locked]
    Learner:
      type: object
      required: [id, name, email, role, status, team, points, streak, progress, activeCourse, lastActive]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/AccountStatus" }
        team: { type: string }
        points: { type: integer }
        streak: { type: integer }
        progress: { type: number }
        activeCourse: { type: string }
        lastActive: { type: string }
    AccountInput:
      type: object
      required: [name, email, role, password]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        team: { type: string }
        password: { type: string, minLength: 8 }
    AccountUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        team: { type: string, minLength: 1 }
    AccountRoleUpdate:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/UserRole" }
    AccountStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/AccountStatus" }
    AccountPasswordReset:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8 }

    # ------------------------------------------------ catalog / gamification
    LearningPath:
      type: object
      required: [id, title, description, courses, courseTitles, duration, completion, learners, accent]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        courses: { type: integer }
        courseTitles:
          type: array
          items: { type: string }
        duration: { type: string }
        completion: { type: number }
        learners: { type: integer }
        accent: { type: string }
    EnrollmentInput:
      type: object
      required: [courseId, learnerIds]
      properties:
        courseId: { type: integer }
        learnerIds:
          type: array
          minItems: 1
          items: { type: integer }
    EnrollmentResult:
      type: object
      required: [enrolled, skipped, message]
      properties:
        enrolled: { type: integer }
        skipped: { type: integer }
        message: { type: string }
    Certificate:
      type: object
      required: [id, learner, course, serial, issuedAt, status]
      properties:
        id: { type: integer }
        learner: { type: string }
        course: { type: string }
        serial: { type: string }
        issuedAt: { type: string }
        status: { type: string, enum: [Đã cấp, Chờ cấp] }
    LeaderboardEntry:
      type: object
      required: [id, name, team, points, streak, badges, rank]
      properties:
        id: { type: integer }
        name: { type: string }
        team: { type: string }
        points: { type: integer }
        streak: { type: integer }
        badges: { type: integer }
        rank: { type: integer }
    LearnerBadge:
      type: object
      required: [id, learner, name, description, icon, awardedAt]
      properties:
        id: { type: integer }
        learner: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        awardedAt: { type: string }
    LearningPlugin:
      type: object
      required: [id, name, description, standard, status, icon]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        standard: { type: string }
        status: { type: string, enum: [Đang bật, Sẵn sàng, Chưa kết nối] }
        icon: { type: string }
    LessonCompletionResult:
      type: object
      required: [progress, certificateIssued, pointsAwarded]
      properties:
        progress: { type: number, description: "Course progress of the current student, 0-100" }
        certificateIssued: { type: boolean }
        pointsAwarded: { type: integer }
    XapiEventInput:
      type: object
      required: [verb, objectId, score]
      properties:
        verb: { type: string, minLength: 1 }
        objectId: { type: string, minLength: 1 }
        score: { type: number, minimum: 0, maximum: 100 }
        raw: { type: object, additionalProperties: true }
    XapiEvent:
      type: object
      required: [id, learnerId, verb, objectId, score, timestamp]
      properties:
        id: { type: integer }
        learnerId: { type: integer }
        verb: { type: string }
        objectId: { type: string }
        score: { type: number }
        timestamp: { type: string }

    # ------------------------------------------------ materials
    MaterialType:
      type: string
      enum: [pdf, doc, slide, video, link]
    Material:
      type: object
      required: [id, courseId, lessonId, lessonNumber, title, type, fileUrl, fileName, fileSize, description, uploadedBy, downloadCount, createdAt]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        lessonId: { type: [integer, "null"], description: "Lesson this material belongs to" }
        lessonNumber: { type: integer, description: "Deprecated: use lessonId" }
        title: { type: string }
        type: { $ref: "#/components/schemas/MaterialType" }
        fileUrl: { type: string }
        fileName: { type: [string, "null"] }
        fileSize: { type: [string, "null"] }
        description: { type: [string, "null"] }
        uploadedBy: { type: string }
        downloadCount: { type: integer }
        createdAt: { type: string, format: date-time }
    MaterialInput:
      type: object
      required: [title, type, fileUrl]
      properties:
        title: { type: string, minLength: 1 }
        type: { $ref: "#/components/schemas/MaterialType" }
        fileUrl: { type: string, minLength: 1 }
        fileName: { type: string }
        fileSize: { type: string }
        description: { type: string }
        lessonId: { type: integer, description: "Lesson of the same course" }
        lessonNumber: { type: integer, minimum: 1, description: "Deprecated: use lessonId" }
    DownloadResult:
      type: object
      required: [downloadCount]
      properties:
        downloadCount: { type: integer }

    # ------------------------------------------------ assignments
    Assignment:
      type: object
      required: [id, courseId, title, description, dueDate, maxPoints, attachmentUrl, attachmentName, createdBy, createdAt]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        title: { type: string }
        description: { type: string }
        dueDate: { type: string, description: "YYYY-MM-DD" }
        maxPoints: { type: number }
        attachmentUrl: { type: [string, "null"] }
        attachmentName: { type: [string, "null"] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    AssignmentInput:
      type: object
      required: [title, dueDate]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        dueDate: { type: string, minLength: 1 }
        maxPoints: { type: number, exclusiveMinimum: 0 }
        attachmentUrl: { type: string }
        attachmentName: { type: string }

    # ------------------------------------------------ submissions
    SubmissionStatus:
      type: string
      enum: [submitted, graded]
    Submission:
      type: object
      required: [id, assignmentId, studentId, studentName, studentAvatar, fileUrl, fileName, fileSize, textContent, status, grade, feedback, gradedBy, gradedAt, submittedAt]
      properties:
        id: { type: integer }
        assignmentId: { type: integer }
        studentId: { type: integer }
        studentName: { type: string }
        studentAvatar: { type: string }
        fileUrl: { type: [string, "null"] }
        fileName: { type: [string, "null"] }
        fileSize: { type: [string, "null"] }
        textContent: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/SubmissionStatus" }
        grade: { type: [number, "null"] }
        feedback: { type: [string, "null"] }
        gradedBy: { type: [string, "null"] }
        gradedAt: { type: [string, "null"], format: date-time }
        submittedAt: { type: string, format: date-time }
    SubmissionInput:
      type: object
      properties:
        fileUrl: { type: string }
        fileName: { type: string }
        fileSize: { type: string }
        textContent: { type: string }
    GradeInput:
      type: object
      required: [grade]
      properties:
        grade: { type: number, minimum: 0 }
        feedback: { type: string }

    # ------------------------------------------------ course content
    LessonType:
      type: string
      enum: [video, text, document, quiz]
    LessonSummary:
      type: object
      required: [id, sectionId, title, type, position, durationMinutes, isPublished, completed]
      properties:
        id: { type: integer }
        sectionId: { type: integer }
        title: { type: string }
        type: { $ref: "#/components/schemas/LessonType" }
        position: { type: integer }
        durationMinutes: { type: integer }
        isPublished: { type: boolean }
        completed: { type: boolean, description: "Completed by the current user" }
    CourseSection:
      type: object
      required: [id, courseId, title, position, lessons]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        title: { type: string }
        position: { type: integer }
        lessons:
          type: array
          items: { $ref: "#/components/schemas/LessonSummary" }
    OutlineProgress:
      type: object
      required: [completed, total, percent]
      properties:
        completed: { type: integer }
        total: { type: integer, description: "Published lessons" }
        percent: { type: integer }
    CourseOutline:
      type: object
      required: [courseId, canEdit, enrolled, sections, progress]
      properties:
        courseId: { type: integer }
        canEdit: { type: boolean, description: "Current user is the instructor or an admin" }
        enrolled: { type: boolean, description: "Current user is enrolled as a student" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/CourseSection" }
        progress: { $ref: "#/components/schemas/OutlineProgress" }
    QuizQuestion:
      type: object
      required: [id, prompt, options, correctIndex, explanation]
      properties:
        id: { type: integer }
        prompt: { type: string }
        options:
          type: array
          items: { type: string }
        correctIndex: { type: [integer, "null"], description: "Only sent to the instructor and admins" }
        explanation: { type: [string, "null"], description: "Only sent to the instructor and admins" }
    Lesson:
      type: object
      required: [id, courseId, sectionId, title, type, position, contentHtml, mediaUrl, durationMinutes, isPublished, passScore, questions, completed, bestScore, updatedAt]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        sectionId: { type: integer }
        title: { type: string }
        type: { $ref: "#/components/schemas/LessonType" }
        position: { type: integer }
        contentHtml: { type: string, description: "Sanitized HTML" }
        mediaUrl: { type: [string, "null"], description: "Video or document URL" }
        durationMinutes: { type: integer }
        isPublished: { type: boolean }
        passScore: { type: integer, description: "Quiz pass mark, 0-100" }
        questions:
          type: array
          items: { $ref: "#/components/schemas/QuizQuestion" }
        completed: { type: boolean }
        bestScore: { type: [integer, "null"], description: "Best quiz score of the current user" }
        updatedAt: { type: string, format: date-time }
    SectionInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
    LessonInput:
      type: object
      required: [sectionId, title, type]
      properties:
        sectionId: { type: integer }
        title: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: "#/components/schemas/LessonType" }
    LessonUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: "#/components/schemas/LessonType" }
        contentHtml: { type: string, maxLength: 200000 }
        mediaUrl: { type: [string, "null"] }
        durationMinutes: { type: integer, minimum: 0, maximum: 1440 }
        isPublished: { type: boolean }
        passScore: { type: integer, minimum: 0, maximum: 100 }
    OutlineOrderInput:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items:
            type: object
            required: [id, lessonIds]
            properties:
              id: { type: integer }
              lessonIds:
                type: array
                items: { type: integer }
    QuizQuestionInput:
      type: object
      required: [prompt, options, correctIndex]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 1000 }
        options:
          type: array
          minItems: 2
          maxItems: 6
          items: { type: string, minLength: 1, maxLength: 500 }
        correctIndex: { type: integer, minimum: 0 }
        explanation: { type: string, maxLength: 1000 }
    QuizQuestionsInput:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/QuizQuestionInput" }
    QuizAttemptInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          description: Chosen option index for each question, in question order
          items: { type: integer, minimum: 0 }
    QuizQuestionResult:
      type: object
      required: [questionId, chosenIndex, correctIndex, correct, explanation]
      properties:
        questionId: { type: integer }
        chosenIndex: { type: integer }
        correctIndex: { type: integer }
        correct: { type: boolean }
        explanation: { type: [string, "null"] }
    QuizAttemptResult:
      type: object
      required: [score, passed, passScore, correctCount, total, results, completion]
      properties:
        score: { type: integer }
        passed: { type: boolean }
        passScore: { type: integer }
        correctCount: { type: integer }
        total: { type: integer }
        results:
          type: array
          items: { $ref: "#/components/schemas/QuizQuestionResult" }
        completion:
          description: Set when this attempt completed the lesson
          oneOf:
            - $ref: "#/components/schemas/LessonCompletionResult"
            - type: "null"

    # ------------------------------------------------ schedule
    MeetingPlatform:
      type: string
      enum: [teams, meet, zoom, other]
    ClassSession:
      type: object
      required: [id, courseId, courseTitle, lessonId, lessonTitle, title, notes, meetingUrl, platform, startsAt, endsAt, durationMinutes, seriesId, canJoin]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        courseTitle: { type: string }
        lessonId: { type: [integer, "null"] }
        lessonTitle: { type: [string, "null"] }
        title: { type: string, description: "Topic, or the course title when none was given" }
        notes: { type: [string, "null"] }
        meetingUrl: { type: [string, "null"], description: "Only for enrolled students, the instructor and admins" }
        platform: { $ref: "#/components/schemas/MeetingPlatform" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        durationMinutes: { type: integer }
        seriesId: { type: [string, "null"], description: "Shared by sessions created together as a weekly series" }
        canJoin: { type: boolean, description: "The current user may open the meeting link" }
    ClassSessionInput:
      type: object
      required: [meetingUrl, startsAt, durationMinutes]
      properties:
        title: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 2000 }
        meetingUrl: { type: string, minLength: 1, maxLength: 2000 }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 15, maximum: 480 }
        lessonId: { type: [integer, "null"] }
        repeatWeeks:
          type: integer
          minimum: 1
          maximum: 26
          description: "Total number of weekly sessions to create (1 = a single session)"
    ClassSessionUpdate:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 2000 }
        meetingUrl: { type: string, minLength: 1, maxLength: 2000 }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 15, maximum: 480 }
        lessonId: { type: [integer, "null"] }
    SessionDeleteScope:
      type: string
      enum: [single, following]
    SessionDeleteResult:
      type: object
      required: [deleted, message]
      properties:
        deleted: { type: integer }
        message: { type: string }

    # ------------------------------------------------ upload
    MediaPreset:
      type: object
      required: [id, title, type, url, duration, sizeText, format, description]
      properties:
        id: { type: string }
        title: { type: string }
        type: { $ref: "#/components/schemas/MediaType" }
        url: { type: string }
        duration: { type: string }
        sizeText: { type: string }
        format: { type: string }
        description: { type: string }
    UploadInput:
      type: object
      description: Either `presetId`, or `name` + `data` (base64 or data URL)
      properties:
        presetId: { type: string }
        name: { type: string }
        type: { type: string, description: "MIME type" }
        data: { type: string }
    UploadResult:
      type: object
      required: [url, fileName, fileType, storage]
      properties:
        url: { type: string }
        fileName: { type: string }
        originalName: { type: string }
        fileType: { $ref: "#/components/schemas/MediaType" }
        fileSize: { type: integer }
        sizeText: { type: string }
        presetId: { type: string }
        storage: { type: string, enum: [cloudflare_r2, local, preset] }
    UploadedFile:
      type: object
      required: [fileName, url, size, createdAt]
      properties:
        fileName: { type: string }
        url: { type: string }
        size: { type: integer }
        createdAt: { type: string, format: date-time }
