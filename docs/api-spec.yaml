openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: |
    Learning management system API.

    Every endpoint except `GET /healthz`, `GET /auth/config`, `POST /auth/login` and
    `POST /auth/demo-login` requires `Authorization: Bearer <token>`.
    The acting user is always taken from the token, never from the request body.
    Errors always use the `ErrorResponse` shape.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Sessions and identity
  - name: lms
    description: LMS dashboard, learning, and automation
  - name: content
    description: Course materials, assignments and submissions
  - name: upload
    description: File upload and media presets
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      security: []
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  # ---------------------------------------------------------------- AUTH
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      security: []
      summary: Public auth configuration (e.g. whether demo login is enabled)
      responses:
        "200":
          description: Auth configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Account is locked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/demo-login:
    post:
      operationId: demoLogin
      tags: [auth]
      security: []
      summary: Sign in as a seeded demo account (only when ENABLE_DEMO_LOGIN=true)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoLoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "403":
          description: Account is locked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }

  # ---------------------------------------------------------------- DASHBOARD
  /lms/dashboard:
    get:
      operationId: getLmsDashboard
      tags: [lms]
      summary: Get dashboard overview
      responses:
        "200":
          description: LMS overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  # ---------------------------------------------------------------- COURSES
  /lms/courses:
    get:
      operationId: listLmsCourses
      tags: [lms]
      summary: List courses visible to the current user
      description: Students see active courses and courses they are enrolled in; lecturers and admins see all.
      responses:
        "200":
          description: Course catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Course" }
    post:
      operationId: createLmsCourse
      tags: [lms]
      summary: Create a course (lecturer or admin)
      description: A lecturer becomes the instructor. An admin may set `instructorId`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseInput" }
      responses:
        "201":
          description: Created course
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /lms/courses/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getLmsCourse
      tags: [lms]
      summary: Get one course
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateLmsCourse
      tags: [lms]
      summary: Update a course (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseUpdate" }
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteLmsCourse
      tags: [lms]
      summary: Delete a course and its content (instructor or admin)
      responses:
        "200":
          description: Course deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /lms/courses/{id}/learners:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: listCourseLearners
      tags: [lms]
      summary: Students enrolled in a course (instructor or admin)
      responses:
        "200":
          description: Enrolled students
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Learner" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- ACCOUNTS
  /lms/accounts:
    get:
      operationId: listLmsAccounts
      tags: [lms]
      summary: List accounts (admin sees everyone, lecturer sees students)
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Learner" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createLmsAccount
      tags: [lms]
      summary: Create an account with a role and initial password (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /lms/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updateLmsAccount
      tags: [lms]
      summary: Update an account's name, email or team (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteLmsAccount
      tags: [lms]
      summary: Permanently delete an account and its enrollments, submissions and sessions (admin)
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/accounts/{id}/role:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updateLmsAccountRole
      tags: [lms]
      summary: Change an account's role (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountRoleUpdate" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/accounts/{id}/status:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updateLmsAccountStatus
      tags: [lms]
      summary: Lock or unlock an account; locking signs the user out everywhere (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountStatusUpdate" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/accounts/{id}/password:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      operationId: resetLmsAccountPassword
      tags: [lms]
      summary: Set a new password for an account and sign it out everywhere (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountPasswordReset" }
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- CATALOG / GAMIFICATION
  /lms/learning-paths:
    get:
      operationId: listLmsLearningPaths
      tags: [lms]
      summary: List learning paths
      responses:
        "200":
          description: Learning paths
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LearningPath" }
  /lms/enrollments/auto-enroll:
    post:
      operationId: autoEnrollLearners
      tags: [lms]
      summary: Enroll learners into a course (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentInput" }
      responses:
        "201":
          description: Enrollment result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/certificates:
    get:
      operationId: listLmsCertificates
      tags: [lms]
      summary: List certificates
      responses:
        "200":
          description: Certificates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Certificate" }
  /lms/leaderboard:
    get:
      operationId: getLmsLeaderboard
      tags: [lms]
      summary: Get leaderboard
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeaderboardEntry" }
  /lms/badges:
    get:
      operationId: listLmsBadges
      tags: [lms]
      summary: List awarded badges
      responses:
        "200":
          description: Badges
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LearnerBadge" }
  /lms/plugins:
    get:
      operationId: listLmsPlugins
      tags: [lms]
      summary: List learning standard plugins
      responses:
        "200":
          description: Plugins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LearningPlugin" }
  /lms/progress/complete:
    post:
      operationId: completeLmsLesson
      tags: [lms]
      summary: Mark a lesson complete for the current student
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonCompletionInput" }
      responses:
        "200":
          description: Lesson completion result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonCompletionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/xapi/events:
    post:
      operationId: recordXapiEvent
      tags: [lms]
      summary: Record an xAPI event for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/XapiEventInput" }
      responses:
        "201":
          description: Recorded xAPI event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XapiEvent" }

  # ---------------------------------------------------------------- MATERIALS
  /lms/courses/{id}/materials:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: listCourseMaterials
      tags: [content]
      summary: List materials of a course (enrolled, instructor or admin)
      responses:
        "200":
          description: Materials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Material" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createCourseMaterial
      tags: [content]
      summary: Add a material to a course (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaterialInput" }
      responses:
        "201":
          description: Created material
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/materials/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      operationId: deleteMaterial
      tags: [content]
      summary: Delete a material (instructor or admin)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/materials/{id}/download:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: recordMaterialDownload
      tags: [content]
      summary: Count a material download
      responses:
        "200":
          description: New download count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- ASSIGNMENTS
  /lms/assignments:
    get:
      operationId: listMyAssignments
      tags: [content]
      summary: Assignments across all courses visible to the current user
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Assignment" }
  /lms/courses/{id}/assignments:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: listCourseAssignments
      tags: [content]
      summary: List assignments of a course (enrolled, instructor or admin)
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Assignment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createCourseAssignment
      tags: [content]
      summary: Create an assignment (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentInput" }
      responses:
        "201":
          description: Created assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/assignments/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      operationId: deleteAssignment
      tags: [content]
      summary: Delete an assignment and its submissions (instructor or admin)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- SUBMISSIONS
  /lms/submissions:
    get:
      operationId: listMySubmissions
      tags: [content]
      summary: Submissions visible to the current user (own for students, own courses for lecturers)
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/SubmissionStatus" }
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Submission" }
  /lms/assignments/{id}/submissions:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: listAssignmentSubmissions
      tags: [content]
      summary: Submissions of an assignment (students only see their own)
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Submission" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: submitAssignment
      tags: [content]
      summary: Submit or resubmit the current student's work
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionInput" }
      responses:
        "201":
          description: Saved submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lms/submissions/{id}/grade:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: gradeSubmission
      tags: [content]
      summary: Grade a submission (instructor or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GradeInput" }
      responses:
        "200":
          description: Graded submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- UPLOAD
  /upload:
    post:
      operationId: uploadFile
      tags: [upload]
      summary: Upload a base64 file or link a preset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "201":
          description: Stored file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/BadRequest" }
  /upload/presets:
    get:
      operationId: listMediaPresets
      tags: [upload]
      summary: Built-in sample media library
      responses:
        "200":
          description: Presets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MediaPreset" }
  /upload/recent:
    get:
      operationId: listRecentUploads
      tags: [upload]
      summary: Files stored on the local disk (admin)
      responses:
        "200":
          description: Files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UploadedFile" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Sign-in required or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Not allowed for this user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    # ------------------------------------------------ common
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    UserRole:
      type: string
      enum: [student, lecturer, admin]

    # ------------------------------------------------ auth
    AuthConfig:
      type: object
      required: [demoLoginEnabled]
      properties:
        demoLoginEnabled: { type: boolean }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    DemoLoginInput:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/UserRole" }
    AuthUser:
      type: object
      required: [id, name, email, role, team, avatar, title, points, streak, progress, activeCourse]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        team: { type: string }
        avatar: { type: string }
        title: { type: string }
        points: { type: integer }
        streak: { type: integer }
        progress: { type: number }
        activeCourse: { type: string }
    AuthSession:
      type: object
      required: [token, user, message]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/AuthUser" }
        message: { type: string }

    # ------------------------------------------------ dashboard
    ActivityItem:
      type: object
      required: [id, title, detail, time, kind]
      properties:
        id: { type: integer }
        title: { type: string }
        detail: { type: string }
        time: { type: string }
        kind: { type: string, enum: [enrollment, completion, certificate, quiz] }
    EngagementDay:
      type: object
      required: [day, active, completed]
      properties:
        day: { type: string }
        active: { type: integer }
        completed: { type: integer }
    DashboardSummary:
      type: object
      required: [activeCourses, totalLearners, completionRate, pendingCertificates, weeklyEngagement, recentActivity]
      properties:
        activeCourses: { type: integer }
        totalLearners: { type: integer }
        completionRate: { type: number }
        pendingCertificates: { type: integer }
        weeklyEngagement:
          type: array
          items: { $ref: "#/components/schemas/EngagementDay" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }

    # ------------------------------------------------ courses
    CourseLevel:
      type: string
      enum: [Cơ bản, Trung cấp, Nâng cao]
    CourseStatus:
      type: string
      enum: [Đang hoạt động, Bản nháp, Lưu trữ]
    CourseFormat:
      type: string
      enum: [Native, SCORM 1.2, xAPI, H5P]
    MediaType:
      type: string
      enum: [video, audio, document, scorm]
    Course:
      type: object
      required: [id, title, description, category, level, duration, lessons, enrolled, progress, status, format, accent, instructorId, instructorName, mediaUrl, mediaType]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        level: { $ref: "#/components/schemas/CourseLevel" }
        duration: { type: string }
        lessons: { type: integer }
        enrolled: { type: integer }
        progress: { type: number }
        status: { $ref: "#/components/schemas/CourseStatus" }
        format: { $ref: "#/components/schemas/CourseFormat" }
        accent: { type: string }
        instructorId: { type: [integer, "null"] }
        instructorName: { type: string }
        mediaUrl: { type: [string, "null"] }
        mediaType: { type: [string, "null"] }
    CourseInput:
      type: object
      required: [title, description, category, level, duration, lessons, format]
      properties:
        title: { type: string, minLength: 2 }
        description: { type: string }
        category: { type: string }
        level: { $ref: "#/components/schemas/CourseLevel" }
        duration: { type: string }
        lessons: { type: integer, minimum: 1 }
        format: { $ref: "#/components/schemas/CourseFormat" }
        instructorId: { type: integer, description: "Admin only; ignored for lecturers" }
        mediaUrl: { type: [string, "null"] }
        mediaType: { $ref: "#/components/schemas/MediaType" }
    CourseUpdate:
      type: object
      properties:
        title: { type: string, minLength: 2 }
        description: { type: string }
        category: { type: string }
        level: { $ref: "#/components/schemas/CourseLevel" }
        duration: { type: string }
        lessons: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/CourseStatus" }
        format: { $ref: "#/components/schemas/CourseFormat" }
        instructorId: { type: integer, description: "Admin only" }
        mediaUrl: { type: [string, "null"] }
        mediaType: { $ref: "#/components/schemas/MediaType" }

    # ------------------------------------------------ accounts
    AccountStatus:
      type: string
      enum: [active, locked]
    Learner:
      type: object
      required: [id, name, email, role, status, team, points, streak, progress, activeCourse, lastActive]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/AccountStatus" }
        team: { type: string }
        points: { type: integer }
        streak: { type: integer }
        progress: { type: number }
        activeCourse: { type: string }
        lastActive: { type: string }
    AccountInput:
      type: object
      required: [name, email, role, password]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        team: { type: string }
        password: { type: string, minLength: 8 }
    AccountUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        team: { type: string, minLength: 1 }
    AccountRoleUpdate:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/UserRole" }
    AccountStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/AccountStatus" }
    AccountPasswordReset:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8 }

    # ------------------------------------------------ catalog / gamification
    LearningPath:
      type: object
      required: [id, title, description, courses, courseTitles, duration, completion, learners, accent]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        courses: { type: integer }
        courseTitles:
          type: array
          items: { type: string }
        duration: { type: string }
        completion: { type: number }
        learners: { type: integer }
        accent: { type: string }
    EnrollmentInput:
      type: object
      required: [courseId, learnerIds]
      properties:
        courseId: { type: integer }
        learnerIds:
          type: array
          minItems: 1
          items: { type: integer }
    EnrollmentResult:
      type: object
      required: [enrolled, skipped, message]
      properties:
        enrolled: { type: integer }
        skipped: { type: integer }
        message: { type: string }
    Certificate:
      type: object
      required: [id, learner, course, serial, issuedAt, status]
      properties:
        id: { type: integer }
        learner: { type: string }
        course: { type: string }
        serial: { type: string }
        issuedAt: { type: string }
        status: { type: string, enum: [Đã cấp, Chờ cấp] }
    LeaderboardEntry:
      type: object
      required: [id, name, team, points, streak, badges, rank]
      properties:
        id: { type: integer }
        name: { type: string }
        team: { type: string }
        points: { type: integer }
        streak: { type: integer }
        badges: { type: integer }
        rank: { type: integer }
    LearnerBadge:
      type: object
      required: [id, learner, name, description, icon, awardedAt]
      properties:
        id: { type: integer }
        learner: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        awardedAt: { type: string }
    LearningPlugin:
      type: object
      required: [id, name, description, standard, status, icon]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        standard: { type: string }
        status: { type: string, enum: [Đang bật, Sẵn sàng, Chưa kết nối] }
        icon: { type: string }
    LessonCompletionInput:
      type: object
      required: [courseId, lessonId, score]
      properties:
        courseId: { type: integer }
        lessonId: { type: string, minLength: 1 }
        score: { type: number, minimum: 0, maximum: 100 }
    LessonCompletionResult:
      type: object
      required: [progress, certificateIssued, pointsAwarded]
      properties:
        progress: { type: number }
        certificateIssued: { type: boolean }
        pointsAwarded: { type: integer }
    XapiEventInput:
      type: object
      required: [verb, objectId, score]
      properties:
        verb: { type: string, minLength: 1 }
        objectId: { type: string, minLength: 1 }
        score: { type: number, minimum: 0, maximum: 100 }
        raw: { type: object, additionalProperties: true }
    XapiEvent:
      type: object
      required: [id, learnerId, verb, objectId, score, timestamp]
      properties:
        id: { type: integer }
        learnerId: { type: integer }
        verb: { type: string }
        objectId: { type: string }
        score: { type: number }
        timestamp: { type: string }

    # ------------------------------------------------ materials
    MaterialType:
      type: string
      enum: [pdf, doc, slide, video, link]
    Material:
      type: object
      required: [id, courseId, lessonNumber, title, type, fileUrl, fileName, fileSize, description, uploadedBy, downloadCount, createdAt]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        lessonNumber: { type: integer }
        title: { type: string }
        type: { $ref: "#/components/schemas/MaterialType" }
        fileUrl: { type: string }
        fileName: { type: [string, "null"] }
        fileSize: { type: [string, "null"] }
        description: { type: [string, "null"] }
        uploadedBy: { type: string }
        downloadCount: { type: integer }
        createdAt: { type: string, format: date-time }
    MaterialInput:
      type: object
      required: [title, type, fileUrl]
      properties:
        title: { type: string, minLength: 1 }
        type: { $ref: "#/components/schemas/MaterialType" }
        fileUrl: { type: string, minLength: 1 }
        fileName: { type: string }
        fileSize: { type: string }
        description: { type: string }
        lessonNumber: { type: integer, minimum: 1 }
    DownloadResult:
      type: object
      required: [downloadCount]
      properties:
        downloadCount: { type: integer }

    # ------------------------------------------------ assignments
    Assignment:
      type: object
      required: [id, courseId, title, description, dueDate, maxPoints, attachmentUrl, attachmentName, createdBy, createdAt]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        title: { type: string }
        description: { type: string }
        dueDate: { type: string, description: "YYYY-MM-DD" }
        maxPoints: { type: number }
        attachmentUrl: { type: [string, "null"] }
        attachmentName: { type: [string, "null"] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    AssignmentInput:
      type: object
      required: [title, dueDate]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        dueDate: { type: string, minLength: 1 }
        maxPoints: { type: number, exclusiveMinimum: 0 }
        attachmentUrl: { type: string }
        attachmentName: { type: string }

    # ------------------------------------------------ submissions
    SubmissionStatus:
      type: string
      enum: [submitted, graded]
    Submission:
      type: object
      required: [id, assignmentId, studentId, studentName, studentAvatar, fileUrl, fileName, fileSize, textContent, status, grade, feedback, gradedBy, gradedAt, submittedAt]
      properties:
        id: { type: integer }
        assignmentId: { type: integer }
        studentId: { type: integer }
        studentName: { type: string }
        studentAvatar: { type: string }
        fileUrl: { type: [string, "null"] }
        fileName: { type: [string, "null"] }
        fileSize: { type: [string, "null"] }
        textContent: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/SubmissionStatus" }
        grade: { type: [number, "null"] }
        feedback: { type: [string, "null"] }
        gradedBy: { type: [string, "null"] }
        gradedAt: { type: [string, "null"], format: date-time }
        submittedAt: { type: string, format: date-time }
    SubmissionInput:
      type: object
      properties:
        fileUrl: { type: string }
        fileName: { type: string }
        fileSize: { type: string }
        textContent: { type: string }
    GradeInput:
      type: object
      required: [grade]
      properties:
        grade: { type: number, minimum: 0 }
        feedback: { type: string }

    # ------------------------------------------------ upload
    MediaPreset:
      type: object
      required: [id, title, type, url, duration, sizeText, format, description]
      properties:
        id: { type: string }
        title: { type: string }
        type: { $ref: "#/components/schemas/MediaType" }
        url: { type: string }
        duration: { type: string }
        sizeText: { type: string }
        format: { type: string }
        description: { type: string }
    UploadInput:
      type: object
      description: Either `presetId`, or `name` + `data` (base64 or data URL)
      properties:
        presetId: { type: string }
        name: { type: string }
        type: { type: string, description: "MIME type" }
        data: { type: string }
    UploadResult:
      type: object
      required: [url, fileName, fileType, storage]
      properties:
        url: { type: string }
        fileName: { type: string }
        originalName: { type: string }
        fileType: { $ref: "#/components/schemas/MediaType" }
        fileSize: { type: integer }
        sizeText: { type: string }
        presetId: { type: string }
        storage: { type: string, enum: [cloudflare_r2, local, preset] }
    UploadedFile:
      type: object
      required: [fileName, url, size, createdAt]
      properties:
        fileName: { type: string }
        url: { type: string }
        size: { type: integer }
        createdAt: { type: string, format: date-time }
